# ==========================================
# Perfil dos testes: H2 em memoria no modo Oracle, no lugar do Oracle da FIAP
# ==========================================
# nome aleatorio: cada contexto de teste ganha o proprio banco, senao o
# schema-test.sql rodaria duas vezes no mesmo e o CREATE TABLE falharia
spring.datasource.url=jdbc:h2:mem:motiva-${random.uuid};MODE=Oracle
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# o schema vem do schema-test.sql, copia do script da Sprint 3: os testes
# esbarram nas mesmas CHECK, FK, UNIQUE e IDENTITY do Oracle
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql

# none, e nao validate: o H2 le o NUMBER sem precisao como DECFLOAT e
# reprovaria colunas que no Oracle estao certas. A validacao dos tipos so
# vale contra o Oracle, no mvn spring-boot:run
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
